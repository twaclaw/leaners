<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Blocks script execution from anything but our own files, so raw HTML in a
     Markdown document cannot run. connect-src limits where the page can talk
     to at all. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'wasm-unsafe-eval';
  style-src 'self';
  img-src 'self' data: https:;
  connect-src 'self';
  base-uri 'none';
  form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leaners</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="brand" href="#/">leaners</a>
  <span id="actions"></span>
</header>
<div class="layout">
  <nav><ul id="doclist"></ul></nav>
  <main><article id="content">Loading&hellip;</article></main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
