name = "leaners"
defaultTargets = ["Leaners", "Extracted"]

# Aeneas's Lean backend pins Lean 4.31.0 and Mathlib v4.31.0, so lean-toolchain
# here must match: the extracted model in Extracted/ does `import Aeneas`.
# Pinned by commit deliberately; treat upgrades as scheduled work, never
# incidental. See design.md section 8.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "c10cc997a2cc885f5b2c9ef3929cc05632cb106c"
subDir = "backends/lean"

[[lean_lib]]
name = "Leaners"

[[lean_lib]]
name = "Extracted"

# Prints the model's results for verified/tests/vectors.txt in the same format as
# the Rust bin of the same name. `make crosscheck` diffs them.
[[lean_exe]]
name = "vectors"
root = "Vectors"
