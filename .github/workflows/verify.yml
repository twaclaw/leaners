# The "middle ground" of design.md section 9: one cheap job, no Lean, that ties
# the shipped binary to the committed sources. Two checks, because they can be
# bound with different strengths:
#
#   1. Source hashes must match build-manifest.json exactly. That is what
#      catches a Rust edit that never made it into the extraction the proofs
#      are about.
#   2. The committed pkg/render.wasm must compute the same function as a wasm
#      rebuilt here from those sources, checked by rendering a corpus through
#      both and diffing the HTML.
#
# Check 2 is behavioural rather than byte-for-byte on purpose. rustc does not
# promise byte-identical wasm across hosts: a toolchain carrying different
# components embeds different paths, so a macOS-built artifact and a Linux
# rebuild differ in bytes while computing the same function. Byte equality is
# still checked, but where it is meaningful: verify.sh rebuilds on the machine
# that recorded the manifest.
#
# The proofs stay local. A Mathlib-sized Lean build does not belong in a
# one-minute gate.

name: verify

on:
  push:
    branches: [main]
    paths:
      - "verified/**"
      - "pkg/**"
      - "proofs/Extracted/**"
      - "build-manifest.json"
      - "Makefile"
      - "tools/**"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "verified/**"
      - "pkg/**"
      - "proofs/Extracted/**"
      - "build-manifest.json"
      - "Makefile"
      - "tools/**"
      - ".github/workflows/verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manifest is the single source of truth for the toolchain; pinning
      # anything else here would let the two drift apart silently.
      - name: Pin the rustc recorded in build-manifest.json
        run: |
          version=$(python3 -c "import json; print(json.load(open('build-manifest.json'))['toolchains']['rustc'].split()[1])")
          rustup toolchain install "$version" --profile minimal --component clippy --component rustfmt
          rustup default "$version"
          rustup target add wasm32-unknown-unknown

      - name: Lint
        run: make lint

      - name: Test
        run: cargo test --manifest-path verified/Cargo.toml

      - name: Rebuild the wasm from the committed sources
        run: |
          cp pkg/render.wasm "$RUNNER_TEMP/committed.wasm"
          rm -rf verified/wasm/target
          make wasm
          cp pkg/render.wasm "$RUNNER_TEMP/rebuilt.wasm"

      # If this fails, a source file changed without `make manifest` being run,
      # which usually means the extraction the proofs are about is stale too.
      - name: Source hashes must match the manifest
        run: python3 tools/leaners/cli.py manifest --check --sources-only

      # And this is what binds the committed binary to those sources: whatever
      # the byte-level differences between hosts, the two must render the whole
      # corpus, hostile vectors included, to identical HTML.
      - name: The committed wasm must match a rebuild, behaviourally
        run: |
          mapfile -t docs < <(find content -name '*.md' | sort)
          docs+=(verified/tests/vectors.txt)
          node tools/wasm-render.mjs "$RUNNER_TEMP/committed.wasm" "${docs[@]}" > "$RUNNER_TEMP/committed.html"
          node tools/wasm-render.mjs "$RUNNER_TEMP/rebuilt.wasm" "${docs[@]}" > "$RUNNER_TEMP/rebuilt.html"
          if diff -u "$RUNNER_TEMP/committed.html" "$RUNNER_TEMP/rebuilt.html"; then
            echo "committed wasm matches the rebuild on ${#docs[@]} documents"
          else
            echo "::error::the committed pkg/render.wasm does not behave like a rebuild from the committed sources"
            exit 1
          fi
