<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A filled tile rather than a bare stroke: browser tabs come in light and
       dark, and a dark check on transparent disappears in one of them. -->
  <rect width="32" height="32" rx="7" fill="#1a7f37"/>
  <path d="M9 16.5 L14 21.5 L23 11" fill="none" stroke="#fff"
        stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
