[project]
name = "leaners-tools"
version = "0.1.0"
description = "Local helpers for the leaners site: manifest generation, link checking, preview server."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
leaners = "leaners.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/leaners"]
